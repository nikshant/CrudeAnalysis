<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" rx="13" fill="#07090F"/>
  <!-- Gold fill layer -->
  <rect x="2" y="2" width="60" height="60" rx="11" fill="rgba(212,168,64,0.1)"/>
  <!-- Gold border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12" fill="none" stroke="#D4A840" stroke-width="2.5"/>
  <!-- NT monogram -->
  <text
    x="32" y="45"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="900"
    fill="#D4A840"
    letter-spacing="-1"
  >NT</text>
</svg>
